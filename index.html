<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capital City State Trail</title>

  <!-- MapLibre GL JS (local copy — no CDN required) -->
  <script src="lib/maplibre-gl.5.10.0.js"></script>
  <link href="lib/maplibre-gl.5.10.0.css" rel="stylesheet" />

  <!-- PMTiles protocol (needed for terrain in Step 5) -->
  <script src="lib/pmtiles.4.3.0.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // --- Customize your trail (edit these!) ---
    const TRAIL_COLOR  = '#2b7a3b';
    const TRAIL_WIDTH  = 4;
    const TRAIL_DASH   = [2, 2];

    // Initialize PMTiles protocol (used in Step 5 for terrain)
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',
      center: [-89.389, 43.054],  // Capital City State Trail, Madison WI
      zoom: 12,
      hash: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', function () {
      // Insert trail below all label/symbol layers so text stays readable
      const firstSymbolLayer = map.getStyle().layers.find(l => l.type === 'symbol')?.id;

      map.addSource('capital-city-trail', {
        type: 'geojson',
        data: 'sources/capital_city_trail.geojson'
      });

      map.addLayer({
        id: 'trail-line',
        type: 'line',
        source: 'capital-city-trail',
        paint: {
          'line-color': TRAIL_COLOR,
          'line-width': TRAIL_WIDTH,
          'line-dasharray': TRAIL_DASH
        }
      }, firstSymbolLayer);
    });
  </script>
</body>
</html>
