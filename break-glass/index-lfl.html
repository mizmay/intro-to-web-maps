<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Free Libraries — Madison</title>
  <script src="../lib/maplibre-gl.5.24.0.js"></script>
  <link href="../lib/maplibre-gl.5.24.0.css" rel="stylesheet" />
  <script src="../lib/pmtiles.4.3.0.js"></script>
  <script src="../lib/load-svg.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

    const map = new maplibregl.Map({
      container: 'map',
      style: '../basemaps/style-watercolor.json',
      center: [-89.375, 43.1],
      zoom: 11,
      hash: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', async function () {
      map.addImage('littlefreelibrary', await loadSVG('../basemaps/icons/littlefreelibrary.svg'));

      map.addSource('lfl', {
        type: 'geojson',
        data: 'little_free_libraries.geojson'
      });

      map.addLayer({
        id: 'lfl-icons',
        type: 'symbol',
        source: 'lfl',
        layout: {
          'icon-image': 'littlefreelibrary',
          'icon-size': ['interpolate', ['linear'], ['zoom'], 10, 0.7, 16, 2],
          'icon-allow-overlap': true
        }
      });

      map.on('click', 'lfl-icons', function (e) {
        const props = e.features[0].properties;
        const title = props.name || 'Little Free Library';

        const content = `
          <div style="display:flex;align-items:flex-start">
            <img src="../basemaps/icons/littlefreelibrary.svg" width="48" height="48" alt="Little Free Library Icon">
            <div>
              <strong>${title}</strong><br>
              OSM: <a href="https://www.openstreetmap.org/node/${props.osm_id}" target="_blank">${props.osm_id}</a>
              ${props.operator ? `<br>Operator: ${props.operator}` : ''}
            </div>
          </div>`;

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(content)
          .addTo(map);
      });

      map.on('mouseenter', 'lfl-icons', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'lfl-icons', () => map.getCanvas().style.cursor = '');
    });
  </script>
</body>
</html>
